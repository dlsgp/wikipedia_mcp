[project]
name = "wikipedia-mcp-server"
version = "0.1.0"
description = "FastAPI + MCP server for searching and summarizing Wikipedia articles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.7.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
wikipedia-mcp-server = "wikipedia_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikipedia_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

